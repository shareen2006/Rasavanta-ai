<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#F5F0E5"/>
  <!-- Subtle pattern -->
  <rect width="800" height="600" fill="url(#grid)" opacity="0.15"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#244B39"/>
    </pattern>
  </defs>
  <!-- Plate circle -->
  <circle cx="400" cy="270" r="130" fill="white" opacity="0.6"/>
  <circle cx="400" cy="270" r="118" fill="none" stroke="#244B39" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.4"/>
  <!-- Fork -->
  <g transform="translate(345, 170)" fill="#244B39" opacity="0.55">
    <rect x="8" y="0" width="4" height="50" rx="2"/>
    <rect x="0" y="0" width="4" height="30" rx="2"/>
    <rect x="16" y="0" width="4" height="30" rx="2"/>
    <rect x="0" y="28" width="20" height="4" rx="2"/>
    <rect x="6" y="28" width="8" height="80" rx="2"/>
  </g>
  <!-- Spoon -->
  <g transform="translate(434, 165)" fill="#244B39" opacity="0.55">
    <ellipse cx="10" cy="22" rx="10" ry="22"/>
    <rect x="7" y="40" width="6" height="68" rx="3"/>
  </g>
  <!-- Sparkle dots -->
  <circle cx="310" cy="210" r="4" fill="#A7B99A" opacity="0.7"/>
  <circle cx="490" cy="195" r="3" fill="#A7B99A" opacity="0.5"/>
  <circle cx="330" cy="340" r="3" fill="#244B39" opacity="0.3"/>
  <circle cx="468" cy="350" r="4" fill="#A7B99A" opacity="0.5"/>
  <!-- RASAVANTA AI label -->
  <text x="400" y="445" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="middle" fill="#244B39" opacity="0.75">RASAVANTA AI</text>
  <text x="400" y="472" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2" text-anchor="middle" fill="#6B8C6E" opacity="0.7">Recipe Image Unavailable</text>
  <!-- Thin line decoration -->
  <line x1="300" y1="488" x2="500" y2="488" stroke="#A7B99A" stroke-width="1" opacity="0.5"/>
</svg>
